<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Live quiz results</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <script src="./embed-config.js"></script>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }
      #frame {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
      #placeholder {
        display: grid;
        height: 100%;
        place-items: center;
        padding: 16px;
        text-align: center;
      }
      #placeholder h1 {
        margin: 0 0 8px;
        font-size: 16px;
      }
      #placeholder p {
        margin: 0;
        font-size: 13px;
        line-height: 1.5;
        color: #475569;
      }
      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="placeholder">
      <div>
        <h1>No session connected</h1>
        <p>
          Open <strong>Home &rsaquo; Quiz Host Controls</strong>, paste your embed link, and this
          slide will start showing live results.
        </p>
      </div>
    </div>
    <iframe
      id="frame"
      class="hidden"
      title="Live quiz results"
      allow="fullscreen"
      referrerpolicy="origin"
    ></iframe>

    <script>
      Office.onReady(function () {
        var frame = document.getElementById('frame')
        var placeholder = document.getElementById('placeholder')

        QuizEmbed.watchConfig(function (config) {
          if (!config) {
            frame.classList.add('hidden')
            frame.removeAttribute('src')
            placeholder.classList.remove('hidden')
            return
          }
          placeholder.classList.add('hidden')
          frame.classList.remove('hidden')
          frame.src = QuizEmbed.buildDisplayUrl(config)
        })
      })
    </script>
  </body>
</html>
