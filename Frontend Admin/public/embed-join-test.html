<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Participant join iframe smoke test</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        background: #e8eef7;
        color: #0f172a;
      }
      .wrap {
        max-width: 960px;
        margin: 0 auto;
        padding: 1.25rem;
      }
      h1 {
        font-size: 1.15rem;
        margin: 0 0 0.35rem;
      }
      p {
        margin: 0 0 1rem;
        font-size: 0.9rem;
        color: #475569;
      }
      label {
        display: block;
        font-size: 0.8rem;
        font-weight: 600;
        margin-bottom: 0.35rem;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-bottom: 1rem;
      }
      input {
        flex: 1;
        min-width: 12rem;
        height: 2.5rem;
        border: 1px solid #bfdbfe;
        border-radius: 0.75rem;
        padding: 0 0.75rem;
        font: inherit;
      }
      button {
        height: 2.5rem;
        border: 0;
        border-radius: 0.75rem;
        padding: 0 1rem;
        background: #0f2a4a;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }
      .frame {
        background: #fff;
        border: 1px solid #bfdbfe;
        border-radius: 1rem;
        overflow: hidden;
        height: min(80dvh, 720px);
        box-shadow: 0 8px 24px rgb(15 42 74 / 8%);
      }
      iframe {
        width: 100%;
        height: 100%;
        border: 0;
      }
      code {
        font-size: 0.85em;
        background: #f1f5f9;
        padding: 0.1em 0.35em;
        border-radius: 0.35em;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Participant join — iframe smoke test</h1>
      <p>
        Loads the participant join UI in an iframe (same origin). Prefer
        <code>/embed/participant/{code}</code> when integrations are enabled.
        Optional query: <code>?name=…&amp;email=…</code> (auto-joins when OTP is off),
        or a signed <code>?join_token=…</code> from Share → Embed → Mint.
      </p>
      <label for="code">Session code</label>
      <div class="row">
        <input id="code" name="code" placeholder="ABC123" autocomplete="off" spellcheck="false" />
        <input id="name" name="name" placeholder="Name (optional)" />
        <input id="email" name="email" placeholder="Email (optional)" type="email" />
        <input id="joinToken" name="join_token" placeholder="join_token (optional, Phase 3)" style="min-width:18rem" />
        <label style="display:flex;align-items:center;gap:0.35rem;font-weight:500">
          <input id="useEmbed" type="checkbox" checked />
          Use /embed/participant
        </label>
        <button type="button" id="load">Load iframe</button>
      </div>
      <div class="frame">
        <iframe id="frame" title="Participant join"></iframe>
      </div>
    </div>
    <script>
      const params = new URLSearchParams(window.location.search)
      const codeInput = document.getElementById('code')
      const nameInput = document.getElementById('name')
      const emailInput = document.getElementById('email')
      const joinTokenInput = document.getElementById('joinToken')
      const useEmbed = document.getElementById('useEmbed')
      const frame = document.getElementById('frame')

      codeInput.value = (params.get('code') || '').toUpperCase()
      nameInput.value = params.get('name') || ''
      emailInput.value = params.get('email') || ''
      joinTokenInput.value = params.get('join_token') || params.get('join_identity_token') || ''
      if (params.get('embed') === '0') useEmbed.checked = false

      function buildJoinSrc() {
        const code = String(codeInput.value || '')
          .trim()
          .toUpperCase()
        if (!code) return ''
        const q = new URLSearchParams()
        const name = String(nameInput.value || '').trim()
        const email = String(emailInput.value || '').trim()
        const joinToken = String(joinTokenInput.value || '').trim()
        if (name) q.set('name', name)
        if (email) q.set('email', email)
        if (joinToken) q.set('join_token', joinToken)
        const qs = q.toString()
        const path = useEmbed.checked
          ? `/embed/participant/${encodeURIComponent(code)}`
          : `/join/${encodeURIComponent(code)}`
        return `${path}${qs ? `?${qs}` : ''}`
      }

      function load() {
        const src = buildJoinSrc()
        if (!src) {
          window.alert('Enter a session code')
          return
        }
        frame.src = src
        const next = new URL(window.location.href)
        next.searchParams.set('code', String(codeInput.value || '').trim().toUpperCase())
        const name = String(nameInput.value || '').trim()
        const email = String(emailInput.value || '').trim()
        const joinToken = String(joinTokenInput.value || '').trim()
        if (name) next.searchParams.set('name', name)
        else next.searchParams.delete('name')
        if (email) next.searchParams.set('email', email)
        else next.searchParams.delete('email')
        if (joinToken) next.searchParams.set('join_token', joinToken)
        else next.searchParams.delete('join_token')
        next.searchParams.set('embed', useEmbed.checked ? '1' : '0')
        window.history.replaceState({}, '', next)
      }

      document.getElementById('load').addEventListener('click', load)
      useEmbed.addEventListener('change', () => {
        if (codeInput.value) load()
      })
      if (codeInput.value) load()
    </script>
  </body>
</html>
